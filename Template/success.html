<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Success! | Craftora</title>
    <link rel="stylesheet" href="demo_style.css">
    <style>
        body {
            background: #B2A691; /* Uniform Taupe Color */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .success-card {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 500px;
        }
        .success-icon {
            font-size: 60px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 32px; }
        p { color: #666; line-height: 1.6; }
        .btn-home {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: black;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Your order was successfully placed!</h1>
        <p>Thank you for shopping with <strong>Craftora</strong>. We are currently preparing your handmade items. You will receive an email confirmation shortly.</p>
        <a href="demo_page.html" class="btn-home">Return to Shop</a>
    </div>

</body>
</html>
