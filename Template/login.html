<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="demo_style.css">
</head>

<body class="login-page">

<a href="demo_page.html" class="back-btn">← Back</a>

<!-- LEFT IMAGE -->
<div class="login-left"></div>

<!-- RIGHT SIDE -->
<div class="login-right">
<!--
  <form class="login-form" onsubmit="goToProducts(event)">

    <h2>Login</h2>
    <p class="subtitle">If you are already a member, easily log in now.</p>

    <input type="email" placeholder="Email" required>

    <div class="password-box">
      <input type="password" placeholder="Password" required>
      <span>👁️</span>

    <button type="submit">Login</button>

  <form id="login-form" class="login-form" onsubmit="goToProducts(event)">
      <h2>Login</h2>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
      <p>New here? <a href="#" onclick="toggleForms()">Create an account</a></p>
  </form>

  <form id="signup-form" class="login-form" onsubmit="goToProducts(event)" style="display: none;">
      <h2>Register</h2>
      <input type="text" name="username" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
      <p>Already have an account? <a href="#" onclick="toggleForms()">Log in</a></p>
  </form>

    </div>
-->

</div>
 <!-- LOGO HERE -->
  <img src="images/logo.png" class="logo-corner">

</div>
<!-- login-right -->

<script>
function goToProducts(event) {
  event.preventDefault(); // Prevents the form from refreshing the page or showing an error
  window.location.href = "demo_page.html"; // Takes you to your main shop page
}

// This function switches between Login and Register views
function toggleForms() {
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');

    if (loginForm.style.display === "none") {
        loginForm.style.display = "block";
        signupForm.style.display = "none";
    } else {
        loginForm.style.display = "none";
        signupForm.style.display = "block";
    }
}
</script>

</body>
</html>
